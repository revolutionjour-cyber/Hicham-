name: Build and Publish Debug APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Temurin Java 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Verify Java environment
        run: |
          echo "=== Java Environment ==="
          java -version
          echo "JAVA_HOME: $JAVA_HOME"

          JAVA_VER_STRING=$(java -version 2>&1 | awk -F '"' '/version/ {print $2}')
          if [ -z "$JAVA_VER_STRING" ]; then
            echo "::error::Could not detect Java version"
            exit 1
          fi

          MAJOR_VERSION=$(echo "$JAVA_VER_STRING" | awk -F '.' '{if ($1 == "1") print $2; else print $1}')
          echo "Detected Java Major Version: $MAJOR_VERSION"

          if [ -z "$MAJOR_VERSION" ] || ! [[ "$MAJOR_VERSION" =~ ^[0-9]+$ ]]; then
            echo "::error::Failed to parse Java major version from '$JAVA_VER_STRING'"
            exit 1
          fi

          if [ "$MAJOR_VERSION" -lt 17 ]; then
            echo "::error::Java version $MAJOR_VERSION is lower than the required version 17"
            exit 1
          fi

          echo "Java 17 or newer verified successfully (detected: $MAJOR_VERSION)"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      - name: Create temporary debug keystore
        run: |
          if [ -f "./debug.keystore" ]; then
            echo "./debug.keystore already exists, skipping generation."
          else
            echo "Generating temporary debug keystore..."
            keytool -genkey -v \
              -keystore ./debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -dname "CN=Android Debug,O=Android,C=US" \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000
          fi

          if [ ! -f "./debug.keystore" ]; then
            echo "::error::Failed to find or create ./debug.keystore"
            exit 1
          fi
          echo "Temporary debug keystore verified."

      - name: Build the debug APK
        run: |
          gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Verify the APK
        run: |
          EXPECTED_APK="app/build/outputs/apk/debug/app-debug.apk"
          if [ ! -f "$EXPECTED_APK" ]; then
            echo "::error::Expected debug APK not found at: $EXPECTED_APK"
            echo "Searching only inside app/build/outputs/apk for any discovered APKs:"
            if [ -d "app/build/outputs/apk" ]; then
              find app/build/outputs/apk -type f -name "*.apk"
            else
              echo "Directory app/build/outputs/apk does not exist."
            fi
            exit 1
          fi

          if [ ! -f "$EXPECTED_APK" ]; then
            echo "::error::$EXPECTED_APK is not a regular file."
            exit 1
          fi

          if [ ! -s "$EXPECTED_APK" ]; then
            echo "::error::$EXPECTED_APK is empty."
            exit 1
          fi

          case "$EXPECTED_APK" in
            *.apk) ;;
            *) echo "::error::$EXPECTED_APK does not have .apk extension"; exit 1 ;;
          esac

          if [ "$EXPECTED_APK" != "app/build/outputs/apk/debug/app-debug.apk" ]; then
            echo "::error::Path is not exactly app/build/outputs/apk/debug/app-debug.apk"
            exit 1
          fi

          echo "APK successfully verified at: $EXPECTED_APK"

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Prepare APK release asset
        id: prepare_asset
        run: |
          TEMP_RELEASE_DIR="${{ runner.temp }}/release_asset"
          mkdir -p "$TEMP_RELEASE_DIR"

          ORIGINAL_APK="app/build/outputs/apk/debug/app-debug.apk"

          REPO_RAW="${{ github.repository }}"
          REPO_NAME="${REPO_RAW##*/}"
          REPO_CLEAN=$(echo "$REPO_NAME" | tr '[:upper:]' '[:lower:]' | sed 's/[^a-z0-9]/-/g' | sed 's/--*/-/g' | sed 's/^-//;s/-$//')
          if [ -z "$REPO_CLEAN" ]; then
            REPO_CLEAN="android-app"
          fi

          RELEASE_ASSET_NAME="${REPO_CLEAN}-debug-build-${{ github.run_number }}.apk"
          DEST_APK="$TEMP_RELEASE_DIR/$RELEASE_ASSET_NAME"

          cp "$ORIGINAL_APK" "$DEST_APK"

          if [ ! -s "$DEST_APK" ]; then
            echo "::error::Failed to copy APK or destination asset is empty."
            exit 1
          fi

          echo "Prepared release asset: $DEST_APK"
          echo "asset_path=$DEST_APK" >> "$GITHUB_OUTPUT"
          echo "asset_name=$RELEASE_ASSET_NAME" >> "$GITHUB_OUTPUT"

      - name: Publish APK to GitHub Releases
        id: publish_release
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "Checking GitHub CLI..."
          gh --version

          ASSET_PATH="${{ steps.prepare_asset.outputs.asset_path }}"
          ASSET_NAME="${{ steps.prepare_asset.outputs.asset_name }}"

          if [ ! -f "$ASSET_PATH" ]; then
            echo "::error::Release asset does not exist at $ASSET_PATH"
            exit 1
          fi

          if [ ! -s "$ASSET_PATH" ]; then
            echo "::error::Release asset is empty."
            exit 1
          fi

          case "$ASSET_PATH" in
            *.apk) ;;
            *) echo "::error::Release asset does not end with .apk"; exit 1 ;;
          esac

          TAG="debug-apk-build-${{ github.run_number }}-${{ github.run_attempt }}"
          TITLE="Debug APK Build #${{ github.run_number }}"

          BODY=$(cat <<EOF
          ### Debug APK Build Details
          - **Build Type:** Automatically generated debug APK
          - **Builder:** GitHub Actions
          - **Run Number:** ${{ github.run_number }}
          - **Run Attempt:** ${{ github.run_attempt }}
          - **Source Commit:** ${{ github.sha }}
          - **Notice:** This APK is intended for testing and development. It is not a Play Store production release.
          - **Signing:** Signed only with a temporary debug keystore.
          EOF
          )

          gh release create "$TAG" "$ASSET_PATH" \
            --title "$TITLE" \
            --notes "$BODY" \
            --target "${{ github.sha }}" \
            --latest

      - name: Report APK download result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="debug-apk-build-${{ github.run_number }}-${{ github.run_attempt }}"
          ASSET_NAME="${{ steps.prepare_asset.outputs.asset_name }}"
          RELEASE_OUTCOME="${{ steps.publish_release.outcome }}"

          if [ "$RELEASE_OUTCOME" = "success" ]; then
            echo "=== GitHub Release Succeeded ==="
            gh release view "$TAG"

            RELEASE_URL="https://github.com/${{ github.repository }}/releases/tag/$TAG"

            echo "Release Tag: $TAG"
            echo "Release Title: Debug APK Build #${{ github.run_number }}"
            echo "Release URL: $RELEASE_URL"
            echo "APK Asset Filename: $ASSET_NAME"

            echo "### 🚀 APK Download Available" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "The debug APK was built and published to GitHub Releases:" >> "$GITHUB_STEP_SUMMARY"
            echo "- **Release Page:** [$RELEASE_URL]($RELEASE_URL)" >> "$GITHUB_STEP_SUMMARY"
            echo "- **APK Asset:** \`$ASSET_NAME\`" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "You can download the APK directly on your phone from the release **Assets** section." >> "$GITHUB_STEP_SUMMARY"
            echo "Additionally, the standard GitHub Actions artifact named \`app-debug-apk\` is available as a backup." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning::GitHub Release publishing did not succeed (outcome: $RELEASE_OUTCOME)."
            echo "The APK build succeeded and the artifact named 'app-debug-apk' remains available."

            echo "### ⚠️ GitHub Release Notice" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "The debug APK build completed successfully, but publishing to GitHub Releases was not completed." >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "- The Actions artifact named **\`app-debug-apk\`** was uploaded successfully and remains available for download." >> "$GITHUB_STEP_SUMMARY"
          fi
